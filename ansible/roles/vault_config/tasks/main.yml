# ------------------------------------------------------------- AppRole for Vault Agent
- name: Discover the private project network subnet
  ansible.builtin.command:
    argv: ["{{ podman_bin }}", network, inspect, fraygrance, --format, "{{ '{{' }}range .Subnets{{ '}}' }}{{ '{{' }}.Subnet{{ '}}' }}{{ '{{' }}end{{ '}}' }}"]
  register: fray_subnet
  changed_when: false

- name: Write AppRole role fray-api (bound to the project network)
  ansible.builtin.uri:
    url: "{{ fray_vault_addr }}/v1/auth/approle/role/fray-api"
    method: POST
    headers: "{{ fray_vault_headers }}"
    body_format: json
    body:
      token_policies: [fray-api]
      token_ttl: 1h
      token_max_ttl: 4h
      token_bound_cidrs: ["{{ fray_subnet.stdout | trim }}"]
      secret_id_bound_cidrs: ["{{ fray_subnet.stdout | trim }}"]
      secret_id_ttl: 0
      secret_id_num_uses: 0
      token_type: service
    status_code: [200, 204]
  changed_when: false
  no_log: true

- name: Mark Vault as configured for Make (enables agent + API provisioning)
  ansible.builtin.copy:
    dest: "{{ fray_config_dir }}/vault-configured"
    content: "configured by ansible vault_config\n"
    mode: "0600"
