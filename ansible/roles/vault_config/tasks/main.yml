    headers: "{{ fray_vault_headers }}"
    status_code: [200, 404]
  register: fray_tinyfish_meta
  no_log: true

- name: Create an empty TinyFish key placeholder (real key via make tinyfish-key; empty = off)
  ansible.builtin.uri:
    url: "{{ fray_vault_addr }}/v1/kv/data/fray/tinyfish"
    method: POST
    headers: "{{ fray_vault_headers }}"
    body_format: json
    body: { data: { api_key: "" } }
    status_code: [200, 204]
  when: fray_tinyfish_meta.status == 404
  changed_when: true
  no_log: true

